<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptPay POS Cloud</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f3f1f4;color:#312a33}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px;background:#eee7ef}button.primary{background:#71366c;color:white}header{height:62px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 18px;background:white;border-bottom:1px solid #ddd}main{max-width:1280px;margin:12px auto;padding:0 12px}.pos{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:12px;height:calc(100dvh - 100px);min-height:420px}.panel{min-width:0;background:white;border-radius:12px;padding:14px;overflow:auto}.cart{display:flex;flex-direction:column}.lines{flex:1;overflow:auto;min-height:50px}.line{display:flex;align-items:center;justify-content:space-between;gap:5px;border-bottom:1px solid #eee;padding:10px 0}.line button{padding:5px 9px}.tot{font-size:23px;font-weight:800;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.product{background:#fafafa;border:1px solid #ddd;overflow:hidden;text-align:left;padding:0}.product img{width:100%;height:115px;object-fit:cover}.product span{display:block;padding:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}input,textarea,select{border:1px solid #d6ced6;border-radius:8px;padding:10px;max-width:100%}.field{display:grid;gap:4px;margin:10px 0}.field input,.field textarea,.field select{width:100%}.dialog{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.dialog.show{display:flex}.box{background:white;border-radius:15px;padding:20px;width:min(620px,100%);max-height:90dvh;overflow:auto}.box h2{margin-top:0}.muted{color:#777;font-size:13px}.warn{background:#fff1d3;padding:10px;border-radius:8px}.bill{background:white;border:1px solid #ddd;padding:22px;max-width:470px;margin:auto}.bill h2{text-align:center}.receiptLine{display:flex;justify-content:space-between;margin:7px 0}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.settings button{padding:25px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:12px 20px;border-radius:9px;display:none;z-index:90}#login{position:fixed;inset:0;z-index:100;background:#f3f1f4;display:grid;place-items:center}#login .box{box-shadow:0 15px 50px #0002}.hide{display:none!important}#printArea{display:none}@media(max-width:800px){.pos{display:flex;flex-direction:column;height:auto}.cart{min-height:340px;max-height:65dvh}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.settings{grid-template-columns:repeat(2,1fr)}header{padding:8px}header select{max-width:120px}}@media print{body>*{display:none!important}#printArea{display:block!important}.bill{border:0}}
</style></head><body>
<div id="login"><div class="box"><h2>🔐 PromptPay POS</h2><p>กรอกรหัสผ่านเพื่อเข้าใช้งาน</p><form id="loginForm"><div class="field"><input id="password" type="password" placeholder="รหัสผ่าน" required></div><button class="primary" type="submit">เข้าสู่ระบบ</button></form><p id="loginError" class="muted"></p></div></div>
<header><div class="row"><b>PromptPay POS</b><select id="seller"></select></div><div class="row"><span id="sync" class="muted">กำลังเชื่อมต่อ</span><button id="refresh">↻</button><button id="settingsBtn">⚙ ตั้งค่า</button><button id="logout">ออก</button></div></header>
<main><div class="pos"><section class="panel cart"><h3>รายการขาย</h3><div class="lines" id="lines"></div><div class="receiptLine"><span>ส่วนลด</span><button id="discountBtn">กำหนดส่วนลด</button></div><div class="receiptLine"><span>ยอดก่อน VAT</span><span id="beforeVat"></span></div><div class="receiptLine"><span>VAT</span><span id="vat"></span></div><div class="tot"><span>รวม</span><span id="total"></span></div><button class="primary" id="pay">ชำระเงิน</button></section><section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>สินค้า</h3><button id="addProduct">+ เพิ่มสินค้า</button></div><div class="row" style="margin-bottom:10px"><button id="ownerSummary">📊 สรุปแยกเจ้าของ</button><button id="ownersBtn">👥 จัดการเจ้าของ</button><button id="mergeBtn">🔄 รวมข้อมูลจากเครื่องนี้</button><button id="assignOwners">✏️ กำหนดเจ้าของสินค้าเดิม</button></div><div class="grid" id="products"></div></section></div></main>
<div class="dialog" id="modal"><div class="box"><div class="row" style="justify-content:space-between"><h2 id="modalTitle"></h2><button id="close">✕</button></div><div id="modalBody"></div></div></div><div id="printArea"></div><div id="toast" class="toast"></div>
<script>
const API="https://uaxvauqqhtjqubmwdtgj.supabase.co/functions/v1/pos-sync",KEY="ppos_v2";let token=sessionStorage.getItem("pos_token")||"",revision=0,sales=[],cart={},discount={pct:0,baht:0},last=null;
const blank={owners:["เจ้าของ 1","เจ้าของ 2"],products:[],sellers:["ผู้ขาย 1"],seller:"ผู้ขาย 1",shop:{name:"ร้านค้า",logo:"",taxId:"",address:"",phone:"",branch:"สำนักงานใหญ่",receiptNo:1},pp:{type:"mobile",id:""},vat:false};
let data=structuredClone(blank);
const $=x=>document.getElementById(x),fmt=x=>"฿"+Number(x||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const escapeHTML=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notify(x){$("toast").textContent=x;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2500)}
async function api(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const v=await r.json();if(!r.ok)throw Error(v.error||"Server error");return v}
function open(title,body){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.add("show")}function close(){$("modal").classList.remove("show")}
$("close").onclick=close;
async function load(){const r=await api("read");revision=r.revision;sales=r.sales||[];if(r.workspace)data={...structuredClone(blank),...r.workspace};else{const old=localStorage.getItem(KEY);if(old){try{const x=JSON.parse(old);data={...structuredClone(blank),...Object.fromEntries(["products","sellers","seller","shop","pp","vat"].map(k=>[k,x[k]??blank[k]]))};notify("พบข้อมูลเดิมในเครื่องนี้: กดตั้งค่า → นำเข้าข้อมูลเครื่องนี้ เพื่อซิงก์")}catch{}}}data.owners=Array.isArray(data.owners)&&data.owners.length?data.owners:["เจ้าของ 1","เจ้าของ 2"];render();$("sync").textContent="☁ ออนไลน์";return r}
async function save(){const prev=revision;const r=await api("save",{revision:prev,value:data});revision=r.revision;$("sync").textContent="☁ บันทึกแล้ว";render()}
async function mutate(fn){const copy=structuredClone(data);fn();try{await save()}catch(e){data=copy;notify("บันทึกไม่สำเร็จ: "+e.message);await load().catch(()=>{})}}
function subtotal(){return Object.entries(cart).reduce((n,[id,q])=>n+(data.products.find(p=>p.id===id)?.price||0)*q,0)}
function amount(){const sub=subtotal(),disc=Math.min(sub,sub*(+discount.pct||0)/100+(+discount.baht||0)),base=Math.max(0,sub-disc),vat=data.vat?Math.round(base*7)/100:0;return{sub,disc,base,vat,total:Math.round((base+vat)*100)/100}}
function ownerName(p){return p.owner||"ยังไม่ระบุเจ้าของ"}
function render(){const s=$("seller");s.innerHTML=data.sellers.map(n=>'<option>'+escapeHTML(n)+'</option>').join("");s.value=data.seller;const g=$("products");g.innerHTML=data.products.map(p=>'<button class="product" data-id="'+escapeHTML(p.id)+'">'+(p.img?'<img src="'+p.img+'">':'<div style="height:115px;background:#eee;display:grid;place-items:center">🛍</div>')+'<span>'+escapeHTML(p.name||"สินค้า")+'<br><small>'+escapeHTML(ownerName(p))+'</small><br><b>'+fmt(p.price)+'</b></span></button>').join("")||'<p class="muted">ยังไม่มีสินค้า</p>';g.querySelectorAll("button").forEach(b=>b.onclick=()=>{cart[b.dataset.id]=(cart[b.dataset.id]||0)+1;render()});const l=$("lines");l.innerHTML=Object.entries(cart).map(([id,q])=>{const p=data.products.find(x=>x.id===id);return p?'<div class="line"><span>'+escapeHTML(p.name||"สินค้า")+'<br>'+fmt(p.price)+'</span><div class="row"><button data-id="'+id+'" data-step="-1">−</button>'+q+'<button data-id="'+id+'" data-step="1">+</button></div><b>'+fmt(q*p.price)+'</b></div>':""}).join("")||'<p class="muted">เลือกสินค้าเพื่อเริ่มขาย</p>';l.querySelectorAll("button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;cart[id]=(cart[id]||0)+Number(b.dataset.step);if(cart[id]<=0)delete cart[id];render()});const a=amount();$("beforeVat").textContent=fmt(a.base);$("vat").textContent=fmt(a.vat);$("total").textContent=fmt(a.total)}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{const r=await api("login",{password:$("password").value});token=r.token;sessionStorage.setItem("pos_token",token);await load();$("login").classList.add("hide");$("password").value=""}catch(e){$("loginError").textContent=e.message}};
$("logout").onclick=()=>{sessionStorage.removeItem("pos_token");location.reload()};
$("refresh").onclick=()=>load().then(()=>notify("อัปเดตจากฐานข้อมูลแล้ว")).catch(e=>notify(e.message));
$("seller").onchange=e=>mutate(()=>data.seller=e.target.value);
$("discountBtn").onclick=()=>{open("ส่วนลด",'<div class="field">เปอร์เซ็นต์<input id="dp" type="number" value="'+discount.pct+'"></div><div class="field">บาท<input id="db" type="number" value="'+discount.baht+'"></div><button class="primary" id="apply">ใช้ส่วนลด</button>');$("apply").onclick=()=>{discount={pct:Math.max(0,Math.min(100,+$("dp").value||0)),baht:Math.max(0,+$("db").value||0)};close();render()}};
function image(file,cb){const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),scale=Math.min(1,500/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};im.src=reader.result};reader.readAsDataURL(file)}
$("addProduct").onclick=()=>{open("เพิ่มสินค้า",'<div class="field">ชื่อสินค้า<input id="pn" placeholder="สินค้า"></div><div class="field">ราคา<input id="price" type="number" min="0" step=".01"></div><div class="field">เจ้าของสินค้า<select id="ownerProduct">'+data.owners.map(x=>"<option>"+escapeHTML(x)+"</option>").join("")+'</select></div><div class="field">รูปภาพ<input id="photo" type="file" accept="image/*"></div><button class="primary" id="saveProduct">บันทึก</button>');$("saveProduct").onclick=()=>{const price=+$("price").value;if(price<=0)return notify("กรุณาใส่ราคา");const p={id:crypto.randomUUID(),name:$("pn").value||"สินค้า",price,img:"",owner:$("ownerProduct").value};const f=$("photo").files[0];const done=async img=>{p.img=img;await mutate(()=>data.products.push(p));close()};f?image(f,done):done("")}};
$("settingsBtn").onclick=()=>{open("ตั้งค่า",'<div class="settings"><button id="shop">🏪 ข้อมูลร้าน / โลโก้</button><button id="sellers">👤 ผู้ขาย</button><button id="promptpay">▦ PromptPay</button><button id="tax">🧾 ภาษี VAT</button><button id="history">📜 ประวัติขาย</button><button id="import">☁ นำเข้าข้อมูลเครื่องนี้</button></div>');$("shop").onclick=shopSettings;$("sellers").onclick=sellerSettings;$("promptpay").onclick=ppSettings;$("tax").onclick=vatSettings;$("history").onclick=history;$("import").onclick=importLocal};
function shopSettings(){const sh=data.shop;open("ข้อมูลร้าน / โลโก้",'<div class="field">ชื่อร้าน<input id="sn" value="'+escapeHTML(sh.name)+'"></div><div class="field">โลโก้<input type="file" id="logo" accept="image/*"></div><div class="field">เลขผู้เสียภาษี<input id="stid" value="'+escapeHTML(sh.taxId||"")+'"></div><div class="field">ที่อยู่<textarea id="addr">'+escapeHTML(sh.address||"")+'</textarea></div><div class="field">โทรศัพท์<input id="phone" value="'+escapeHTML(sh.phone||"")+'"></div><div class="field">สาขา<input id="branch" value="'+escapeHTML(sh.branch||"")+'"></div><button class="primary" id="ss">บันทึก</button>');$("ss").onclick=()=>{const x={name:$("sn").value,taxId:$("stid").value,address:$("addr").value,phone:$("phone").value,branch:$("branch").value};const f=$("logo").files[0];const done=async img=>{await mutate(()=>data.shop={...data.shop,...x,logo:img||data.shop.logo});close()};f?image(f,done):done("")}}
function sellerSettings(){open("ผู้ขาย",'<div class="row"><input id="newSeller" placeholder="ชื่อผู้ขาย"><button class="primary" id="as">เพิ่ม</button></div><div id="sl">'+data.sellers.map(x=>'<p>'+escapeHTML(x)+'</p>').join("")+'</div>');$("as").onclick=async()=>{const n=$("newSeller").value.trim();if(n){await mutate(()=>{if(!data.sellers.includes(n))data.sellers.push(n);data.seller=n});sellerSettings()}}}
function ppSettings(){open("PromptPay",'<div class="field">ประเภท<select id="ppt"><option value="mobile">เบอร์มือถือ</option><option value="nationalId">เลขบัตรประชาชน</option><option value="ewallet">E-Wallet</option></select></div><div class="field">รหัส PromptPay<input id="ppi" value="'+escapeHTML(data.pp.id||"")+'"></div><button class="primary" id="ps">บันทึก</button>');$("ppt").value=data.pp.type;$("ps").onclick=async()=>{await mutate(()=>data.pp={type:$("ppt").value,id:$("ppi").value.replace(/\D/g,"")});close()}}
function vatSettings(){open("ภาษีมูลค่าเพิ่ม",'<label><input id="vaten" type="checkbox" '+(data.vat?"checked":"")+'> เพิ่ม VAT 7% จากยอดหลังส่วนลด</label><p class="warn">เปิดเฉพาะเมื่อกิจการจดทะเบียน VAT และกำหนดราคาตามนี้</p><button class="primary" id="vs">บันทึก</button>');$("vs").onclick=async()=>{await mutate(()=>data.vat=$("vaten").checked);close()}}
function importLocal(){const old=localStorage.getItem(KEY);if(!old)return notify("ไม่พบข้อมูลเก่าในเครื่องนี้");if(!confirm("นำเข้าสินค้า ผู้ขาย และการตั้งค่าจากเครื่องนี้แทนข้อมูลกลาง? ควรทำเพียงเครื่องเดียว"))return;try{const x=JSON.parse(old);mutate(()=>{for(const k of ["products","sellers","seller","shop","pp","vat"])if(x[k]!==undefined)data[k]=x[k]}).then(()=>notify("นำเข้าข้อมูลแล้ว"))}catch(e){notify(e.message)}}
function crc(s){let c=65535;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&32768?(c<<1^4129)&65535:c<<1&65535}return c.toString(16).toUpperCase().padStart(4,"0")}const tlv=(t,v)=>t+String(v.length).padStart(2,"0")+v;
function ppqr(n){const d=data.pp.id.replace(/\D/g,""),t=data.pp.type;if(t==="mobile"&&(!/^0\d{9}$/.test(d)))throw Error("เบอร์พร้อมเพย์ไม่ถูกต้อง");if(t==="nationalId"&&d.length!==13)throw Error("เลขพร้อมเพย์ไม่ถูกต้อง");if(t==="ewallet"&&d.length!==15)throw Error("E-Wallet ID ไม่ถูกต้อง");const id=t==="mobile"?"0066"+d.slice(1):d,field=t==="mobile"?"01":t==="nationalId"?"02":"03",merchant=tlv("00","A000000677010111")+tlv(field,id);let p=tlv("00","01")+tlv("01","12")+tlv("29",merchant)+tlv("53","764")+tlv("54",n.toFixed(2))+tlv("58","TH")+"6304";return p+crc(p)}
$("pay").onclick=()=>{if(amount().total<=0)return notify("ยังไม่มีสินค้า");open("ชำระเงิน "+fmt(amount().total),'<div class="row"><button id="cash">💵 เงินสด</button><button id="qr">▦ PromptPay</button></div>');$("cash").onclick=cash;$("qr").onclick=qr};
function cash(){const a=amount();open("เงินสด · "+fmt(a.total),'<div class="field">รับเงินมา<input type="number" id="received" min="0" step=".01" placeholder="จำนวนเงิน"></div><div id="change"></div><button class="primary" id="done">บันทึกการขาย</button>');$("received").oninput=()=>{const change=Math.round((+$("received").value-a.total)*100)/100;let cents=Math.max(0,Math.round(change*100));const ds=[1000,500,100,50,20,10,5,2,1,.5,.25];let parts=[];for(const d of ds){const q=Math.floor(cents/Math.round(d*100));if(q){parts.push(fmt(d)+" × "+q);cents-=q*Math.round(d*100)}}$("change").innerHTML='<p>เงินทอน: '+fmt(Math.max(0,change))+'</p><p class="muted">'+parts.join(" · ")+'</p>'};$("done").onclick=()=>{const rec=+$("received").value;if(rec<a.total)return notify("เงินไม่พอ");finish("cash",{received:rec,change:Math.round((rec-a.total)*100)/100})}}
function qr(){try{const p=ppqr(amount().total);open("สแกนจ่าย "+fmt(amount().total),'<div id="qrcode" style="display:flex;justify-content:center;margin:20px"></div><p class="warn">ตรวจยอดเงินเข้าในแอปธนาคารก่อนกดยืนยัน ระบบไม่ตรวจเงินเข้าอัตโนมัติ</p><button class="primary" id="done">ยืนยันว่าได้รับเงินจริงแล้ว</button>');new QRCode($("qrcode"),{text:p,width:240,height:240});$("done").onclick=()=>finish("qr",{})}catch(e){notify(e.message)}}
async function finish(method,extra){const a=amount();const sale={id:crypto.randomUUID(),ref:"POS-"+Date.now(),ts:Date.now(),seller:data.seller,items:Object.entries(cart).map(([id,q])=>{const p=data.products.find(x=>x.id===id);return{name:p?.name||"สินค้า",price:p?.price||0,qty:q,owner:p?.owner||"ยังไม่ระบุเจ้าของ"}}),subtotal:a.sub,discount:a.disc,vat:a.vat,total:a.total,method,shop:structuredClone(data.shop),...extra};try{await api("sale",{sale});last=sale;sales.unshift({id:sale.id,details:sale,total:sale.total,created_at:new Date().toISOString()});cart={};discount={pct:0,baht:0};render();receipt(sale);notify("บันทึกการขายลง Supabase แล้ว")}catch(e){notify("บันทึกไม่สำเร็จ: "+e.message)}}
function receipt(x){let h='<div class="bill">'+(x.shop.logo?'<img style="max-width:130px;max-height:80px;display:block;margin:auto" src="'+x.shop.logo+'">':'')+'<h2>'+escapeHTML(x.shop.name)+'</h2><p style="text-align:center">'+escapeHTML(x.shop.address||"")+'</p><p>เลขที่ '+escapeHTML(x.ref)+'<br>'+new Date(x.ts).toLocaleString("th-TH")+'<br>ผู้ขาย '+escapeHTML(x.seller)+'</p><hr><h2>ใบเสร็จ</h2>'+x.items.map(i=>'<div class="receiptLine"><span>'+escapeHTML(i.name)+' × '+i.qty+'</span><span>'+fmt(i.price*i.qty)+'</span></div>').join("")+'<hr><div class="receiptLine"><span>ส่วนลด</span><span>'+fmt(x.discount)+'</span></div><div class="receiptLine"><span>VAT</span><span>'+fmt(x.vat)+'</span></div><div class="receiptLine"><b>รวม</b><b>'+fmt(x.total)+'</b></div><p>ชำระโดย '+escapeHTML(x.method)+'</p><div id="taxQR"></div><p class="muted">QR สำหรับข้อมูลใบกำกับภาษีเต็มรูป (กรอกข้อมูลบนเครื่องนี้)</p></div>';open("ชำระสำเร็จ ✓",h+'<div class="row"><button id="print">🖨 พิมพ์</button><button id="taxInvoice">ใบกำกับภาษีเต็มรูป</button><button id="next">ขายต่อ</button></div>');new QRCode($("taxQR"),{text:location.origin+"?invoice="+encodeURIComponent(x.ref),width:100,height:100});$("print").onclick=()=>print($("modalBody").querySelector(".bill").outerHTML);$("taxInvoice").onclick=()=>taxForm(x);$("next").onclick=close}
function print(html){$("printArea").innerHTML=html;window.print()}
function taxForm(x){open("ข้อมูลใบกำกับภาษีเต็มรูป",'<div class="field">ชื่อผู้ซื้อ<input id="buyer"></div><div class="field">เลขผู้เสียภาษี<input id="buyerTax"></div><div class="field">ที่อยู่<textarea id="buyerAddress"></textarea></div><button class="primary" id="createTax">สร้างเอกสาร</button>');$("createTax").onclick=()=>{const buyer=$("buyer").value,tax=$("buyerTax").value,addr=$("buyerAddress").value;if(!buyer||!addr)return notify("กรอกชื่อและที่อยู่");const h='<div class="bill"><h2>ใบกำกับภาษีเต็มรูป / ใบเสร็จ</h2><b>'+escapeHTML(x.shop.name)+'</b><p>'+escapeHTML(x.shop.address)+'<br>เลขผู้เสียภาษี '+escapeHTML(x.shop.taxId)+'</p><hr><p>เลขที่ '+escapeHTML(x.ref)+'</p><p>ผู้ซื้อ: '+escapeHTML(buyer)+'<br>เลขผู้เสียภาษี: '+escapeHTML(tax)+'<br>ที่อยู่: '+escapeHTML(addr)+'</p>'+x.items.map(i=>'<div class="receiptLine"><span>'+escapeHTML(i.name)+' × '+i.qty+'</span><span>'+fmt(i.price*i.qty)+'</span></div>').join("")+'<hr><div class="receiptLine"><span>ส่วนลด</span><span>'+fmt(x.discount)+'</span></div><div class="receiptLine"><span>มูลค่าก่อนภาษี</span><span>'+fmt(x.total-x.vat)+'</span></div><div class="receiptLine"><span>VAT</span><span>'+fmt(x.vat)+'</span></div><div class="receiptLine"><b>รวม</b><b>'+fmt(x.total)+'</b></div></div>';open("ใบกำกับภาษีเต็มรูป",h+'<button id="printTax" class="primary">พิมพ์</button>');$("printTax").onclick=()=>print(h)}}
function history(){open("ประวัติการขาย",sales.map(r=>'<button style="display:block;width:100%;margin:5px 0;text-align:left" data-sale="'+r.id+'">'+escapeHTML(r.details?.ref||r.id)+' — '+fmt(r.total)+' — '+new Date(r.created_at).toLocaleString("th-TH")+'</button>').join("")||"ยังไม่มีรายการขาย");$("modalBody").querySelectorAll("[data-sale]").forEach(b=>b.onclick=()=>receipt(sales.find(x=>x.id===b.dataset.sale).details))}

function manageOwners(){open("จัดการเจ้าของสินค้า",'<p class="muted">เจ้าของสินค้าแยกจากผู้ขายที่รับชำระเงิน</p><div class="row"><input id="newOwner" placeholder="ชื่อเจ้าของ"><button id="addOwner" class="primary">เพิ่มเจ้าของ</button></div><div style="margin-top:14px">'+data.owners.map(x=>'<p>'+escapeHTML(x)+'</p>').join("")+'</div>');$("addOwner").onclick=async()=>{let n=$("newOwner").value.trim();if(!n)return notify("กรอกชื่อ");await mutate(()=>{if(!data.owners.includes(n))data.owners.push(n)});manageOwners()}}
function ownerSummary(){const owners=[...new Set([...data.owners,...data.products.map(ownerName),...sales.flatMap(s=>(s.details?.items||[]).map(i=>i.owner||"ยังไม่ระบุเจ้าของ"))])];let html='<p class="muted">ยอดขายคำนวณจากรายการที่บันทึกลงฐานข้อมูลแล้ว ส่วนลดและ VAT กระจายตามสัดส่วนมูลค่าสินค้า</p>';for(const owner of owners){const products=data.products.filter(p=>ownerName(p)===owner),sold=sales.flatMap(s=>(s.details?.items||[]).filter(i=>(i.owner||"ยังไม่ระบุเจ้าของ")===owner).map(i=>({item:i,sale:s.details})));const gross=sold.reduce((n,x)=>n+x.item.price*x.item.qty,0);const net=sold.reduce((n,x)=>{const subtotal=Number(x.sale.subtotal)||0;const v=x.item.price*x.item.qty;return n+(subtotal?v/subtotal*Number(x.sale.total):0)},0);html+='<div style="border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0"><h3>'+escapeHTML(owner)+'</h3><b>ยอดขายตามสัดส่วน: '+fmt(net)+'</b><p class="muted">ยอดก่อนหักส่วนลด / VAT: '+fmt(gross)+'</p><p>สินค้า ('+products.length+'):</p>'+products.map(p=>'<p>• '+escapeHTML(p.name)+' — '+fmt(p.price)+'</p>').join("")+'<p class="muted">จำนวนรายการสินค้าที่ขาย: '+sold.reduce((n,x)=>n+x.item.qty,0)+'</p></div>'}open("สรุปแยกเจ้าของ",html)}
function mergeLocal(){const candidates=[...new Set([KEY,"promptpay_pos_data","promptpay-pos-data","pos_data","posData",...Object.keys(localStorage)])];const found=candidates.map(k=>({key:k,raw:localStorage.getItem(k)})).filter(x=>x.raw);if(!found.length)return notify("ไม่พบข้อมูลเก่าในเครื่องนี้");let out='<p class="warn">ข้อมูลต้นทางในเครื่องจะไม่ถูกลบ ระบบรวมเฉพาะสินค้าที่ไม่ซ้ำตาม ID หรือชื่อและราคา และเพิ่มชื่อผู้ขายที่ไม่ซ้ำ</p><div class="field">แหล่งข้อมูล<select id="localSource">'+found.map(x=>'<option value="'+escapeHTML(x.key)+'">'+escapeHTML(x.key)+'</option>').join("")+'</select></div><button class="primary" id="doMerge">ดูและรวมข้อมูล</button>';open("รวมข้อมูลสินค้าเก่า",out);$("doMerge").onclick=async()=>{const x=JSON.parse(localStorage.getItem($("localSource").value)||"{}");const source=x.data||x;const list=Array.isArray(source.products)?source.products:[];if(!list.length)return notify("ไม่พบสินค้าในชุดข้อมูลนี้");if(!confirm("พบสินค้า "+list.length+" รายการ ต้องการรวมเข้าฐานข้อมูลกลางหรือไม่?"))return;await load();await mutate(()=>{for(const p of list){if(!p||!p.name)continue;const dup=data.products.some(t=>t.id===p.id||t.name===p.name&&Number(t.price)===Number(p.price));if(!dup)data.products.push({...p,id:p.id||crypto.randomUUID(),owner:p.owner||"ยังไม่ระบุเจ้าของ"})}if(Array.isArray(source.sellers))for(const n of source.sellers){if(!data.sellers.includes(n))data.sellers.push(n)}if(source.seller&&!data.sellers.includes(source.seller))data.sellers.push(source.seller)});close();notify("รวมข้อมูลแล้ว กดรีเฟรชอีกเครื่อง")}}
function assignOwners(){open("กำหนดเจ้าของสินค้าเดิม",'<p class="muted">เลือกเจ้าของสินค้าแต่ละชิ้น แล้วกดบันทึก</p>'+data.products.map(p=>'<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid #ddd"><span>'+escapeHTML(p.name)+'</span><select data-product="'+escapeHTML(p.id)+'">'+data.owners.concat(["ยังไม่ระบุเจ้าของ"]).filter((v,i,a)=>a.indexOf(v)===i).map(o=>'<option value="'+escapeHTML(o)+'" '+(ownerName(p)===o?"selected":"")+'>'+escapeHTML(o)+'</option>').join("")+'</select></div>').join("")+'<button class="primary" id="saveOwners">บันทึกเจ้าของสินค้า</button>');$("saveOwners").onclick=async()=>{const values=Array.from($("modalBody").querySelectorAll("[data-product]")).map(s=>({id:s.dataset.product,owner:s.value}));await mutate(()=>{for(const x of values){const p=data.products.find(p=>p.id===x.id);if(p)p.owner=x.owner}});close()}}
$("assignOwners").onclick=assignOwners;
$("ownerSummary").onclick=ownerSummary;$("ownersBtn").onclick=manageOwners;$("mergeBtn").onclick=mergeLocal;
setInterval(async()=>{if(!token||!$("login").classList.contains("hide"))return;try{const r=await api("read");if(r.revision!==revision){revision=r.revision;data={...structuredClone(blank),...r.workspace};data.owners=data.owners?.length?data.owners:blank.owners;render();notify("อัปเดตข้อมูลจากอีกเครื่องแล้ว")}sales=r.sales||[];$("sync").textContent="☁ ซิงก์แล้ว"}catch{$("sync").textContent="⚠ ออฟไลน์"}},7000);

(async()=>{if(token){try{await load();$("login").classList.add("hide")}catch{sessionStorage.removeItem("pos_token")}}})();
</script></body></html>
