<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptPay POS Cloud</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f3f1f4;color:#312a33}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px;background:#eee7ef}button.primary{background:#71366c;color:white}header{height:62px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 18px;background:white;border-bottom:1px solid #ddd}main{max-width:1280px;margin:12px auto;padding:0 12px}.pos{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:12px;height:calc(100dvh - 100px);min-height:420px}.panel{min-width:0;background:white;border-radius:12px;padding:14px;overflow:auto}.cart{display:flex;flex-direction:column}.lines{flex:1;overflow:auto;min-height:50px}.line{display:flex;align-items:center;justify-content:space-between;gap:5px;border-bottom:1px solid #eee;padding:10px 0}.line button{padding:5px 9px}.tot{font-size:23px;font-weight:800;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.product{background:#fafafa;border:1px solid #ddd;overflow:hidden;text-align:left;padding:0}.product-card{position:relative;min-width:0}.product-card>.product{display:block;width:100%}.product-actions{display:flex;gap:5px;margin-top:5px}.product-actions button{flex:1;min-width:0;padding:9px 4px;font-size:13px}.edit-product{background:#e9edff;color:#30428f;border:1px solid #c3cdf8}.selected-product{outline:3px solid #71366c;outline-offset:-3px;background:#f5e8f4}.product-count{display:inline-block;background:#71366c;color:#fff;padding:4px 9px;border-radius:20px;font-size:12px;margin-top:5px}.delete-product{width:auto;margin-top:0;background:#ffe8e8;color:#a32020;border:1px solid #e8b4b4;font-weight:600}.delete-product:hover{background:#ffd2d2}.product img{width:100%;height:115px;object-fit:cover}.product span{display:block;padding:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}input,textarea,select{border:1px solid #d6ced6;border-radius:8px;padding:10px;max-width:100%}.field{display:grid;gap:4px;margin:10px 0}.field input,.field textarea,.field select{width:100%}.dialog{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.dialog.show{display:flex}.box{background:white;border-radius:15px;padding:20px;width:min(620px,100%);max-height:90dvh;overflow:auto}.box h2{margin-top:0}.box:has(.payment-layout){width:min(980px,100%)}.payment-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}.payment-qr,.payment-order{background:#faf8fb;border:1px solid #e5dde5;border-radius:12px;padding:18px;min-width:0}.payment-qr{text-align:center}.payment-qr #qrcode{display:flex;justify-content:center;margin:18px auto}.payment-order{max-height:65dvh;overflow:auto}.payment-order .receiptLine{border-bottom:1px solid #e8e3e8;padding-bottom:8px}.payment-order .payment-grand-total{display:flex;justify-content:space-between;font-size:21px;font-weight:800;margin-top:14px}.payment-qr .primary{width:100%;margin-top:12px}@media(max-width:650px){.payment-layout{grid-template-columns:1fr}.payment-order{max-height:none}}.muted{color:#777;font-size:13px}.warn{background:#fff1d3;padding:10px;border-radius:8px}.bill{background:white;border:1px solid #ddd;padding:22px;max-width:470px;margin:auto}.bill h2{text-align:center}.receiptLine{display:flex;justify-content:space-between;margin:7px 0}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.settings button{padding:25px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:12px 20px;border-radius:9px;display:none;z-index:90}#login{position:fixed;inset:0;z-index:100;background:#f3f1f4;display:grid;place-items:center}#login .box{box-shadow:0 15px 50px #0002}.hide{display:none!important}#printArea{display:none}@media(max-width:800px){.pos{display:flex;flex-direction:column;height:auto}.cart{min-height:340px;max-height:65dvh}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.settings{grid-template-columns:repeat(2,1fr)}header{padding:8px}header select{max-width:120px}}@media print{body>*{display:none!important}#printArea{display:block!important}.bill{border:0}}
</style></head><body>
<div id="login"><div class="box"><h2>🔐 PromptPay POS</h2><p>เลือกผู้ขายและกรอกรหัสของคนนั้น หรือใช้รหัสหลักเพื่อจัดการร้าน</p><div class="field"><label>เข้าใช้ในฐานะ</label><select id="loginSeller"><option value="">ผู้ดูแลระบบ (รหัสหลัก)</option></select></div><form id="loginForm"><div class="field"><input id="password" type="password" placeholder="รหัสผ่าน" required></div><button class="primary" type="submit">เข้าสู่ระบบ</button></form><p id="loginError" class="muted"></p></div></div>
<header><div class="row"><b>PromptPay POS</b><select id="seller"></select></div><div class="row"><span id="sync" class="muted">กำลังเชื่อมต่อ</span><button id="refresh">↻</button><button id="settingsBtn">⚙ ตั้งค่า</button><button id="logout">ออก</button></div></header>
<main><div class="pos"><section class="panel cart"><h3>รายการขาย</h3><div class="lines" id="lines"></div><div class="receiptLine"><span>ส่วนลด</span><button id="discountBtn">กำหนดส่วนลด</button></div><div class="receiptLine"><span>ยอดก่อน VAT</span><span id="beforeVat"></span></div><div class="receiptLine"><span>VAT</span><span id="vat"></span></div><div class="tot"><span>รวม</span><span id="total"></span></div><button class="primary" id="pay">ชำระเงิน</button></section><section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>สินค้า</h3><button id="addProduct">+ เพิ่มสินค้า</button></div><div class="grid" id="products"></div></section></div></main>
<div class="dialog" id="modal"><div class="box"><div class="row" style="justify-content:space-between"><h2 id="modalTitle"></h2><button id="close">✕</button></div><div id="modalBody"></div></div></div><div id="printArea"></div><div id="toast" class="toast"></div>
<script>
const API="https://uaxvauqqhtjqubmwdtgj.supabase.co/functions/v1/pos-sync",KEY="ppos_v2";let accessPermissions={},token=sessionStorage.getItem("pos_token")||"",sessionRole=sessionStorage.getItem("pos_role")||"",sessionSeller=sessionStorage.getItem("pos_seller")||"",revision=0,sales=[],cart={},customSale=null,customItems={},discount={pct:0,baht:0},last=null;
const blank={owners:["เจ้าของ 1","เจ้าของ 2"],products:[],sellers:["ผู้ขาย 1"],seller:"ผู้ขาย 1",shop:{name:"ร้านค้า",logo:"",taxId:"",address:"",phone:"",branch:"สำนักงานใหญ่",receiptNo:1},pp:{type:"mobile",id:""},vat:false};
let data=structuredClone(blank);
const $=x=>document.getElementById(x),fmt=x=>"฿"+Number(x||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const escapeHTML=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notify(x){$("toast").textContent=x;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2500)}
async function api(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const v=await r.json();if(!r.ok)throw Error(v.error||"Server error");return v}
function open(title,body){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.add("show")}function close(){$("modal").classList.remove("show")}
$("close").onclick=close;
async function load(){const r=await api("read");revision=r.revision;sales=r.sales||[];if(r.workspace)data={...structuredClone(blank),...r.workspace};else{const old=localStorage.getItem(KEY);if(old){try{const x=JSON.parse(old);data={...structuredClone(blank),...Object.fromEntries(["products","sellers","seller","shop","pp","vat"].map(k=>[k,x[k]??blank[k]]))};notify("พบข้อมูลเดิมในเครื่องนี้: กดตั้งค่า → นำเข้าข้อมูลเครื่องนี้ เพื่อซิงก์")}catch{}}}data.owners=Array.isArray(data.owners)?data.owners:["เจ้าของ 1","เจ้าของ 2"];render();$("sync").textContent="☁ ออนไลน์";return r}
async function save(){const prev=revision;const r=await api("save",{revision:prev,value:data});revision=r.revision;$("sync").textContent="☁ บันทึกแล้ว";render()}
async function mutate(fn){const copy=structuredClone(data);fn();try{await save()}catch(e){data=copy;notify("บันทึกไม่สำเร็จ: "+e.message);await load().catch(()=>{})}}
function subtotal(){return Object.entries(cart).reduce((n,[id,q])=>{const p=id.startsWith("__custom__:")?customItems[id]:data.products.find(x=>x.id===id);return n+Number(p?.price||0)*Math.max(0,Number(q)||0)},0)}
function amount(){const sub=subtotal(),disc=Math.min(sub,sub*(+discount.pct||0)/100+(+discount.baht||0)),base=Math.max(0,sub-disc),vat=data.vat?Math.round(base*7)/100:0;return{sub,disc,base,vat,total:Math.round((base+vat)*100)/100}}
function ownerName(p){return p.owner||"ยังไม่ระบุเจ้าของ"}
function allowed(p){return sessionRole==="admin"||sessionRole==="main"||sessionRole==="role-admin"||accessPermissions[p]===true}
function render(){
 const s=$("seller");s.innerHTML=data.sellers.map(n=>'<option>'+escapeHTML(n)+'</option>').join("");s.value=sessionRole==="seller"?sessionSeller:data.seller;s.disabled=sessionRole==="seller";
 $("settingsBtn").style.display=Object.keys(accessPermissions).some(k=>accessPermissions[k])||sessionRole==="admin"?"":"none";
 $("addProduct").style.display=allowed("products")?"":"none";
 const g=$("products");
 g.innerHTML=data.products.map(p=>'<div class="product-card"><button class="product '+(cart[p.id]?'selected-product':'')+'" data-id="'+escapeHTML(p.id)+'">'+(p.img?'<img src="'+p.img+'">':'<div style="height:115px;background:#eee;display:grid;place-items:center">🛍</div>')+'<span>'+escapeHTML(p.name||"สินค้า")+'<br><small>'+escapeHTML(ownerName(p))+'</small><br><b>'+fmt(p.price)+'</b>'+(cart[p.id]?'<br><strong class="product-count">เลือกแล้ว '+cart[p.id]+' ชิ้น</strong>':'')+'</span></button>'+(allowed("products")?'<div class="product-actions"><button class="edit-product" data-edit-id="'+escapeHTML(p.id)+'">✏️ แก้ไข</button><button class="delete-product" data-delete-id="'+escapeHTML(p.id)+'">🗑 ลบสินค้า</button></div>':'')+'</div>').join("")+
 '<div class="product-card"><button class="product" id="customProduct"><div style="height:115px;background:#f1e6f4;display:grid;place-items:center;font-size:32px">💰</div><span>อื่น ๆ / ระบุราคาเอง<br><small>เพิ่มได้หลายรายการ</small><br><b>กำหนดราคา</b></span></button></div>';
 g.querySelectorAll("button.product[data-id]").forEach(b=>b.onclick=()=>{const id=b.dataset.id;cart[id]=Math.min(9999,(cart[id]||0)+1);render()});
 $("customProduct").onclick=()=>customForm();
 g.querySelectorAll(".edit-product").forEach(b=>b.onclick=()=>productForm(b.dataset.editId));
 g.querySelectorAll(".delete-product").forEach(b=>b.onclick=async()=>{if(!allowed("products"))return notify("ไม่มีสิทธิ์ลบสินค้า");const id=b.dataset.deleteId,p=data.products.find(x=>x.id===id);if(!p)return;if(!confirm("ลบสินค้า “"+p.name+"” ออกจากร้าน?\\nประวัติการขายเดิมจะไม่ถูกลบ"))return;const previous=structuredClone(data),oldCart={...cart};data.products=data.products.filter(x=>x.id!==id);delete cart[id];try{await save();notify("ลบสินค้าแล้ว")}catch(e){data=previous;cart=oldCart;render();notify("ลบสินค้าไม่สำเร็จ: "+e.message);await load().catch(()=>{})}});
 const l=$("lines");
 l.innerHTML=Object.keys(cart).map(id=>{const p=id.startsWith("__custom__:")?customItems[id]:data.products.find(x=>x.id===id);if(!p)return "";return '<div class="line"><span>'+escapeHTML(p.name||"สินค้า")+'<br><small>'+cart[id]+' ชิ้น × '+fmt(p.price)+'</small></span><b>'+fmt(p.price*cart[id])+'</b>'+(id.startsWith("__custom__:")?'<button data-edit-custom="'+escapeHTML(id)+'" aria-label="แก้ไขรายการ">✏️</button>':'')+'<button data-remove="'+escapeHTML(id)+'" aria-label="ลบจากบิล">✕</button></div>'}).join("")||'<p class="muted">กดรูปสินค้าเพื่อเพิ่มจำนวน กดซ้ำได้ตามต้องการ</p>';
 l.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];delete customItems[b.dataset.remove];render()});
 l.querySelectorAll("[data-edit-custom]").forEach(b=>b.onclick=()=>customForm(b.dataset.editCustom));
 const a=amount();$("beforeVat").textContent=fmt(a.base);$("vat").textContent=fmt(a.vat);$("total").textContent=fmt(a.total);
}
function customForm(id=null){
 const old=id?customItems[id]:null;
 open(old?"แก้ไขรายการอื่น ๆ":"เพิ่มรายการอื่น ๆ",'<div class="field">ชื่อรายการ<input id="customName" maxlength="100" value="'+escapeHTML(old?.name||"สินค้าอื่น ๆ")+'"></div><div class="field">ราคา (บาท)<input id="customPrice" type="number" min="0.01" step="0.01" inputmode="decimal" value="'+(old?.price||"")+'"></div><div class="field">เจ้าของสินค้า<select id="customOwner">'+[...new Set([...data.owners,old?.owner||""])].filter(Boolean).map(o=>'<option value="'+escapeHTML(o)+'" '+(old?.owner===o?'selected':'')+'>'+escapeHTML(o)+'</option>').join("")+'</select></div><button class="primary" id="useCustom">'+(old?"บันทึกการแก้ไข":"เพิ่มลงรายการขาย")+'</button>');
 $("useCustom").onclick=()=>{const price=Number($("customPrice").value),name=$("customName").value.trim();if(!Number.isFinite(price)||price<=0||price>100000000||!name)return notify("กรอกชื่อและราคามากกว่า 0");const key=id||"__custom__:"+crypto.randomUUID();customItems[key]={name,price:Math.round(price*100)/100,owner:$("customOwner").value||"ยังไม่ระบุเจ้าของ"};cart[key]=1;close();render()};
}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{const r=await api("login",{seller:$("loginSeller").value,password:$("password").value});token=r.token;sessionRole=r.role==="main"?"admin":"seller";accessPermissions=r.permissions||{};if(r.role==="admin")accessPermissions={shop:true,owners:true,assign:true,summary:true,products:true,promptpay:true,vat:true,history:true,import:true};sessionSeller=r.seller||"";sessionStorage.setItem("pos_token",token);sessionStorage.setItem("pos_role",sessionRole);sessionStorage.setItem("pos_seller",sessionSeller);await load();$("login").classList.add("hide");$("password").value=""}catch(e){$("loginError").textContent=e.message}};
$("logout").onclick=()=>{sessionStorage.removeItem("pos_token");sessionStorage.removeItem("pos_role");sessionStorage.removeItem("pos_seller");location.reload()};
$("refresh").onclick=()=>load().then(()=>notify("อัปเดตจากฐานข้อมูลแล้ว")).catch(e=>notify(e.message));
$("seller").onchange=e=>{if(sessionRole==="seller")return;mutate(()=>data.seller=e.target.value)};
$("discountBtn").onclick=()=>{open("ส่วนลด",'<div class="field">เปอร์เซ็นต์<input id="dp" type="number" value="'+discount.pct+'"></div><div class="field">บาท<input id="db" type="number" value="'+discount.baht+'"></div><button class="primary" id="apply">ใช้ส่วนลด</button>');$("apply").onclick=()=>{discount={pct:Math.max(0,Math.min(100,+$("dp").value||0)),baht:Math.max(0,+$("db").value||0)};close();render()}};
function image(file,cb){const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),scale=Math.min(1,500/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};im.src=reader.result};reader.readAsDataURL(file)}
function productForm(id=null){if(!allowed("products"))return notify("ไม่มีสิทธิ์จัดการสินค้า");const p=id?data.products.find(x=>x.id===id):null;if(id&&!p)return notify("ไม่พบสินค้า");
 open(p?"แก้ไขสินค้า":"เพิ่มสินค้า",'<div class="field">ชื่อสินค้า<input id="pn" maxlength="100" value="'+escapeHTML(p?.name||"")+'" placeholder="สินค้า"></div><div class="field">ราคา<input id="price" type="number" min="0.01" step=".01" inputmode="decimal" value="'+(p?.price??"")+'"></div><div class="field">เจ้าของสินค้า<select id="ownerProduct">'+[...new Set([...data.owners,p?.owner||""])].filter(Boolean).map(x=>'<option value="'+escapeHTML(x)+'" '+(p?.owner===x?"selected":"")+'>'+escapeHTML(x)+'</option>').join("")+'</select></div>'+(p?.img?'<p><img style="max-height:110px;max-width:180px" src="'+p.img+'"></p>':'')+'<div class="field">รูปภาพ (ถ้าไม่เลือกจะใช้รูปเดิม)<input id="photo" type="file" accept="image/*"></div><button class="primary" id="saveProduct">'+(p?"บันทึกการแก้ไข":"เพิ่มสินค้า")+'</button>');
 $("saveProduct").onclick=()=>{const price=Number($("price").value),name=$("pn").value.trim();if(!Number.isFinite(price)||price<=0||price>100000000||!name)return notify("กรอกชื่อและราคามากกว่า 0");
 const next={id:p?.id||crypto.randomUUID(),name,price:Math.round(price*100)/100,img:p?.img||"",owner:$("ownerProduct").value};
 const button=$("saveProduct");button.disabled=true;const done=async img=>{if(img)next.img=img;const before=structuredClone(data);if(p){const idx=data.products.findIndex(x=>x.id===p.id);if(idx<0){button.disabled=false;return notify("ไม่พบสินค้า")}data.products[idx]={...data.products[idx],...next}}else data.products.push(next);try{await save();close();notify(p?"แก้ไขสินค้าแล้ว":"เพิ่มสินค้าแล้ว")}catch(e){data=before;render();notify("บันทึกไม่สำเร็จ: "+e.message)}finally{button.disabled=false}};
 const f=$("photo").files[0];f?image(f,done):done("");
 };
}
$("addProduct").onclick=()=>productForm();
$("settingsBtn").onclick=()=>{open("ตั้งค่า",'<div class="settings"><button id="shop">🏪 ข้อมูลร้าน / โลโก้</button><button id="sellers">👤 ผู้ขาย</button><button id="promptpay">▦ PromptPay</button><button id="tax">🧾 ภาษี VAT</button><button id="history">📜 ประวัติขาย</button><button id="import">☁ นำเข้าข้อมูลเครื่องนี้</button><button id="ownerSummary">📊 สรุปแยกเจ้าของ</button><button id="ownersBtn">👥 จัดการเจ้าของ</button><button id="assignOwners">✏️ กำหนดเจ้าของสินค้าเดิม</button><button id="mergeBtn">🔄 รวมข้อมูลจากเครื่องนี้</button></div>');$("shop").onclick=shopSettings;$("sellers").onclick=sellerSettings;$("promptpay").onclick=ppSettings;$("tax").onclick=vatSettings;$("history").onclick=history;$("import").onclick=mergeLocal;$("ownerSummary").onclick=ownerSummary;$("ownersBtn").onclick=manageOwners;$("assignOwners").onclick=assignOwners;$("mergeBtn").onclick=mergeLocal};
function shopSettings(){const sh=data.shop;open("ข้อมูลร้าน / โลโก้",'<div class="field">ชื่อร้าน<input id="sn" value="'+escapeHTML(sh.name)+'"></div><div class="field">โลโก้<input type="file" id="logo" accept="image/*"></div><div class="field">เลขผู้เสียภาษี<input id="stid" value="'+escapeHTML(sh.taxId||"")+'"></div><div class="field">ที่อยู่<textarea id="addr">'+escapeHTML(sh.address||"")+'</textarea></div><div class="field">โทรศัพท์<input id="phone" value="'+escapeHTML(sh.phone||"")+'"></div><div class="field">สาขา<input id="branch" value="'+escapeHTML(sh.branch||"")+'"></div><button class="primary" id="ss">บันทึก</button>');$("ss").onclick=()=>{const x={name:$("sn").value,taxId:$("stid").value,address:$("addr").value,phone:$("phone").value,branch:$("branch").value};const f=$("logo").files[0];const done=async img=>{await mutate(()=>data.shop={...data.shop,...x,logo:img||data.shop.logo});close()};f?image(f,done):done("")}}
function oldSellerSettings(){open("ผู้ขาย",'<div class="row"><input id="newSeller" placeholder="ชื่อผู้ขาย"><button class="primary" id="as">เพิ่ม</button></div><div id="sl">'+data.sellers.map(x=>'<p>'+escapeHTML(x)+'</p>').join("")+'</div>');$("as").onclick=async()=>{const n=$("newSeller").value.trim();if(n){await mutate(()=>{if(!data.sellers.includes(n))data.sellers.push(n);data.seller=n});sellerSettings()}}}

function crc(s){let c=65535;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&32768?(c<<1^4129)&65535:c<<1&65535}return c.toString(16).toUpperCase().padStart(4,"0")}const tlv=(t,v)=>t+String(v.length).padStart(2,"0")+v;
function ppqr(n){const d=data.pp.id.replace(/\D/g,""),t=data.pp.type;if(t==="mobile"&&(!/^0\d{9}$/.test(d)))throw Error("เบอร์พร้อมเพย์ไม่ถูกต้อง");if(t==="nationalId"&&d.length!==13)throw Error("เลขพร้อมเพย์ไม่ถูกต้อง");if(t==="ewallet"&&d.length!==15)throw Error("E-Wallet ID ต้องมี 15 หลัก (รหัส 13 หลักใช้แทนไม่ได้)");if(t==="truemoney"&&!/^0\d{9}$/.test(d)&&!(d.length===13&&/^0{3,}/.test(d)))throw Error("TrueMoney Wallet: กรุณากรอกเบอร์มือถือ 10 หลักที่ผูกกับวอลเล็ต");const id=t==="mobile"?"0066"+d.slice(1):t==="truemoney"?"14"+d.padStart(13,"0"):d,field=t==="mobile"?"01":t==="nationalId"?"02":"03",merchant=tlv("00","A000000677010111")+tlv(field,id);let p=tlv("00","01")+tlv("01","12")+tlv("29",merchant)+tlv("53","764")+tlv("54",n.toFixed(2))+tlv("58","TH")+"6304";return p+crc(p)}
$("pay").onclick=()=>{if(amount().total<=0)return notify("ยังไม่มีสินค้า");open("ชำระเงิน "+fmt(amount().total),'<div class="row"><button id="cash">💵 เงินสด</button><button id="qr">▦ PromptPay</button></div>');$("cash").onclick=cash;$("qr").onclick=qr};
function cash(){const a=amount();open("เงินสด · "+fmt(a.total),'<div class="field">รับเงินมา<input type="number" id="received" min="0" step=".01" placeholder="จำนวนเงิน"></div><div id="change"></div><button class="primary" id="done">บันทึกการขาย</button>');$("received").oninput=()=>{const change=Math.round((+$("received").value-a.total)*100)/100;let cents=Math.max(0,Math.round(change*100));const ds=[1000,500,100,50,20,10,5,2,1,.5,.25];let parts=[];for(const d of ds){const q=Math.floor(cents/Math.round(d*100));if(q){parts.push(fmt(d)+" × "+q);cents-=q*Math.round(d*100)}}$("change").innerHTML='<p>เงินทอน: '+fmt(Math.max(0,change))+'</p><p class="muted">'+parts.join(" · ")+'</p>'};$("done").onclick=()=>{const rec=+$("received").value;if(rec<a.total)return notify("เงินไม่พอ");finish("cash",{received:rec,change:Math.round((rec-a.total)*100)/100})}}

function qr(){try{const p=ppqr(amount().total);open("ชำระเงินด้วย PromptPay",'<div class="payment-layout"><section class="payment-qr"><h3 style="margin-top:0">สแกน QR Code เพื่อจ่ายเงิน</h3><div id="qrcode"></div><strong style="font-size:22px">'+fmt(amount().total)+'</strong><p class="warn" style="font-size:13px;text-align:left">ตรวจยอดเงินเข้าในแอปธนาคารก่อนยืนยัน ระบบไม่ตรวจเงินเข้าอัตโนมัติ</p><button class="primary" id="done">ยืนยันว่าได้รับเงินจริงแล้ว</button></section><section class="payment-order">'+paymentSummary()+'</section></div>');const qrSize=Math.min(260,Math.max(160,window.innerWidth-110));new QRCode($("qrcode"),{text:p,width:qrSize,height:qrSize});$("done").onclick=()=>finish("qr",{})}catch(e){notify(e.message)}}

async function finish(method,extra){const a=amount();const sale={id:crypto.randomUUID(),ref:"POS-"+Date.now(),ts:Date.now(),seller:sessionRole==="seller"?sessionSeller:data.seller,items:Object.entries(cart).map(([id,q])=>{const p=id.startsWith("__custom__:")?customItems[id]:data.products.find(x=>x.id===id);return{name:p?.name||"สินค้า",price:p?.price||0,qty:q,owner:p?.owner||"ยังไม่ระบุเจ้าของ"}}),subtotal:a.sub,discount:a.disc,vat:a.vat,total:a.total,method,shop:structuredClone(data.shop),...extra};try{await api("sale",{sale});last=sale;sales.unshift({id:sale.id,details:sale,total:sale.total,created_at:new Date().toISOString()});cart={};customItems={};customSale=null;discount={pct:0,baht:0};render();receipt(sale);notify("บันทึกการขายลง Supabase แล้ว")}catch(e){notify("บันทึกไม่สำเร็จ: "+e.message)}}
function receipt(x){let h='<div class="bill">'+(x.shop.logo?'<img style="max-width:130px;max-height:80px;display:block;margin:auto" src="'+x.shop.logo+'">':'')+'<h2>'+escapeHTML(x.shop.name)+'</h2><p style="text-align:center">'+escapeHTML(x.shop.address||"")+'</p><p>เลขที่ '+escapeHTML(x.ref)+'<br>'+new Date(x.ts).toLocaleString("th-TH")+'<br>ผู้ขาย '+escapeHTML(x.seller)+'</p><hr><h2>ใบเสร็จ</h2>'+x.items.map(i=>'<div class="receiptLine"><span>'+escapeHTML(i.name)+' × '+i.qty+'</span><span>'+fmt(i.price*i.qty)+'</span></div>').join("")+'<hr><div class="receiptLine"><span>ส่วนลด</span><span>'+fmt(x.discount)+'</span></div><div class="receiptLine"><span>VAT</span><span>'+fmt(x.vat)+'</span></div><div class="receiptLine"><b>รวม</b><b>'+fmt(x.total)+'</b></div><p>ชำระโดย '+escapeHTML(x.method)+'</p><div id="taxQR"></div><p class="muted">QR สำหรับข้อมูลใบกำกับภาษีเต็มรูป (กรอกข้อมูลบนเครื่องนี้)</p></div>';open("ชำระสำเร็จ ✓",h+'<div class="row"><button id="print">🖨 พิมพ์</button><button id="taxInvoice">ใบกำกับภาษีเต็มรูป</button><button id="next">ขายต่อ</button></div>');new QRCode($("taxQR"),{text:location.origin+"?invoice="+encodeURIComponent(x.ref),width:100,height:100});$("print").onclick=()=>print($("modalBody").querySelector(".bill").outerHTML);$("taxInvoice").onclick=()=>taxForm(x);$("next").onclick=close}

function ownerSummary(){const owners=[...new Set([...data.owners,...data.products.map(ownerName),...sales.flatMap(s=>(s.details?.items||[]).map(i=>i.owner||"ยังไม่ระบุเจ้าของ"))])];let html='<p class="muted">ยอดขายคำนวณจากรายการที่บันทึกลงฐานข้อมูลแล้ว ส่วนลดและ VAT กระจายตามสัดส่วนมูลค่าสินค้า</p>';for(const owner of owners){const products=data.products.filter(p=>ownerName(p)===owner),sold=sales.flatMap(s=>(s.details?.items||[]).filter(i=>(i.owner||"ยังไม่ระบุเจ้าของ")===owner).map(i=>({item:i,sale:s.details})));const gross=sold.reduce((n,x)=>n+x.item.price*x.item.qty,0);const net=sold.reduce((n,x)=>{const subtotal=Number(x.sale.subtotal)||0;const v=x.item.price*x.item.qty;return n+(subtotal?v/subtotal*Number(x.sale.total):0)},0);html+='<div style="border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0"><h3>'+escapeHTML(owner)+'</h3><b>ยอดขายตามสัดส่วน: '+fmt(net)+'</b><p class="muted">ยอดก่อนหักส่วนลด / VAT: '+fmt(gross)+'</p><p>สินค้า ('+products.length+'):</p>'+products.map(p=>'<p>• '+escapeHTML(p.name)+' — '+fmt(p.price)+'</p>').join("")+'<p class="muted">จำนวนรายการสินค้าที่ขาย: '+sold.reduce((n,x)=>n+x.item.qty,0)+'</p></div>'}open("สรุปแยกเจ้าของ",html)}
function mergeLocal(){const candidates=[...new Set([KEY,"promptpay_pos_data","promptpay-pos-data","pos_data","posData",...Object.keys(localStorage)])];const found=candidates.map(k=>({key:k,raw:localStorage.getItem(k)})).filter(x=>x.raw);if(!found.length)return notify("ไม่พบข้อมูลเก่าในเครื่องนี้");let out='<p class="warn">ข้อมูลต้นทางในเครื่องจะไม่ถูกลบ ระบบรวมเฉพาะสินค้าที่ไม่ซ้ำตาม ID หรือชื่อและราคา และเพิ่มชื่อผู้ขายที่ไม่ซ้ำ</p><div class="field">แหล่งข้อมูล<select id="localSource">'+found.map(x=>'<option value="'+escapeHTML(x.key)+'">'+escapeHTML(x.key)+'</option>').join("")+'</select></div><button class="primary" id="doMerge">ดูและรวมข้อมูล</button>';open("รวมข้อมูลสินค้าเก่า",out);$("doMerge").onclick=async()=>{const x=JSON.parse(localStorage.getItem($("localSource").value)||"{}");const source=x.data||x;const list=Array.isArray(source.products)?source.products:[];if(!list.length)return notify("ไม่พบสินค้าในชุดข้อมูลนี้");if(!confirm("พบสินค้า "+list.length+" รายการ ต้องการรวมเข้าฐานข้อมูลกลางหรือไม่?"))return;await load();await mutate(()=>{for(const p of list){if(!p||!p.name)continue;const dup=data.products.some(t=>t.id===p.id||t.name===p.name&&Number(t.price)===Number(p.price));if(!dup)data.products.push({...p,id:p.id||crypto.randomUUID(),owner:p.owner||"ยังไม่ระบุเจ้าของ"})}if(Array.isArray(source.sellers))for(const n of source.sellers){if(!data.sellers.includes(n))data.sellers.push(n)}if(source.seller&&!data.sellers.includes(source.seller))data.sellers.push(source.seller)});close();notify("รวมข้อมูลแล้ว กดรีเฟรชอีกเครื่อง")}}

async function populateLoginSellers(){try{const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"publicSellers"})});const v=await r.json();const chosen=$("loginSeller").value;$("loginSeller").innerHTML='<option value="">ผู้ดูแลระบบ (รหัสหลัก)</option>'+(v.sellers||[]).map(n=>'<option value="'+escapeHTML(n)+'">'+escapeHTML(n)+'</option>').join("");$("loginSeller").value=chosen}catch{}}
const PERMISSION_LABELS={shop:"ข้อมูลร้าน",owners:"จัดการเจ้าของ",assign:"กำหนดเจ้าของสินค้า",summary:"สรุปเจ้าของ",products:"เพิ่ม/แก้สินค้า",promptpay:"PromptPay",vat:"ภาษี",history:"ประวัติขาย",import:"นำเข้าข้อมูล"};
async function sellerSettings(){if(sessionRole!=="admin")return notify("ใช้รหัสหลักก่อน");const accounts=await api("listSellers");const rows=(accounts.sellers||[]).map(a=>{const n=a.name;return '<div class="row" style="justify-content:space-between;margin:8px 0"><b>'+escapeHTML(n)+'</b><button data-access="'+escapeHTML(n)+'">กำหนดสิทธิ์</button><button data-seller="'+escapeHTML(n)+'">ตั้งหรือเปลี่ยนรหัส</button><button data-remove-seller="'+escapeHTML(n)+'">ลบ</button></div>'}).join("");open("ผู้ขายและรหัสผ่าน",'<p class="muted">รหัสหลัก pos ใช้เพิ่มผู้ขาย ตั้งรหัส และจัดการเจ้าของสินค้า ไม่ต้องสร้าง username</p><div class="field">ชื่อผู้ขาย<input id="newSeller" placeholder="เช่น Peyton"></div><div class="field">รหัสผ่านผู้ขาย<input type="password" id="sellerPassword" minlength="4" placeholder="อย่างน้อย 4 ตัว"></div><button class="primary" id="addSellerAccount">เพิ่ม / ตั้งรหัส</button><div>'+rows+'</div>');$("addSellerAccount").onclick=async()=>{const name=$("newSeller").value.trim(),password=$("sellerPassword").value;if(!name||password.length<4)return notify("กรอกชื่อและรหัสอย่างน้อย 4 ตัว");try{await api("manageSeller",{operation:"upsert",name,password});await mutate(()=>{if(!data.sellers.includes(name))data.sellers.push(name)});sellerSettings();notify("บันทึกผู้ขายแล้ว")}catch(e){notify(e.message)}};$("modalBody").querySelectorAll("[data-access]").forEach(b=>b.onclick=()=>editAccess((accounts.sellers||[]).find(a=>a.name===b.dataset.access)));$("modalBody").querySelectorAll("[data-seller]").forEach(b=>b.onclick=()=>{$("newSeller").value=b.dataset.seller;$("sellerPassword").focus()});$("modalBody").querySelectorAll("[data-remove-seller]").forEach(b=>b.onclick=async()=>{const name=b.dataset.removeSeller;if(!confirm("ลบผู้ขาย "+name+" และปิดรหัสเข้าสู่ระบบ? ประวัติขายเดิมจะยังอยู่"))return;try{await api("manageSeller",{operation:"delete",name});await mutate(()=>{data.sellers=data.sellers.filter(n=>n!==name);if(data.seller===name)data.seller=data.sellers[0]||"ผู้ขาย 1"});sellerSettings()}catch(e){notify(e.message)}})}
function editAccess(a){if(!a)return;open("สิทธิ์: "+a.name,'<div class="field">บทบาท<select id="accountRole"><option value="seller">ผู้ขายทั่วไป</option><option value="admin">แอดมิน</option></select></div>'+Object.entries(PERMISSION_LABELS).map(([k,label])=>'<label style="display:block;padding:6px"><input type="checkbox" data-perm="'+k+'" '+(a.permissions?.[k]?"checked":"")+'> '+label+'</label>').join("")+'<button class="primary" id="saveAccess">บันทึกสิทธิ์</button>');$("accountRole").value=a.role||"seller";$("saveAccess").onclick=async()=>{const permissions={};$("modalBody").querySelectorAll("[data-perm]").forEach(x=>permissions[x.dataset.perm]=x.checked);try{await api("manageSeller",{operation:"access",name:a.name,role:$("accountRole").value,permissions});notify("บันทึกสิทธิ์แล้ว");sellerSettings()}catch(e){notify(e.message)}}}
function manageOwners(){const rows=data.owners.map(x=>'<div class="row" style="justify-content:space-between;margin:8px 0"><b>'+escapeHTML(x)+'</b><button data-delete-owner="'+escapeHTML(x)+'">🗑 ลบเจ้าของ</button></div>').join("");open("จัดการเจ้าของสินค้า",'<p class="muted">การลบจะไม่ลบสินค้าและยอดขายเก่า แต่สินค้าเดิมของเจ้าของที่ถูกลบจะเปลี่ยนเป็น “ยังไม่ระบุเจ้าของ”</p><div class="row"><input id="newOwner" placeholder="ชื่อเจ้าของ"><button id="addOwner" class="primary">เพิ่มเจ้าของ</button></div>'+rows);$("addOwner").onclick=async()=>{const n=$("newOwner").value.trim();if(!n)return notify("กรอกชื่อ");await mutate(()=>{if(!data.owners.includes(n))data.owners.push(n)});manageOwners()};$("modalBody").querySelectorAll("[data-delete-owner]").forEach(b=>b.onclick=async()=>{const n=b.dataset.deleteOwner;if(!confirm("ต้องการลบเจ้าของ "+n+"? สินค้าที่เคยเป็นของคนนี้จะถูกจัดเป็นยังไม่ระบุเจ้าของ แต่ประวัติการขายไม่หาย"))return;await mutate(()=>{data.owners=data.owners.filter(x=>x!==n);for(const p of data.products)if(p.owner===n)p.owner="ยังไม่ระบุเจ้าของ"});manageOwners()})}
populateLoginSellers();

setInterval(async()=>{if(!token||!$("login").classList.contains("hide"))return;try{const r=await api("read");if(r.revision!==revision){revision=r.revision;data={...structuredClone(blank),...r.workspace};data.owners=Array.isArray(data.owners)?data.owners:blank.owners;render();notify("อัปเดตข้อมูลจากอีกเครื่องแล้ว")}sales=r.sales||[];$("sync").textContent="☁ ซิงก์แล้ว"}catch{$("sync").textContent="⚠ ออฟไลน์"}},7000);

(async()=>{if(token){try{const a=await api("myAccess");sessionRole=a.role==="main"?"admin":"seller";accessPermissions=a.permissions||{};if(a.role==="admin")accessPermissions={shop:true,owners:true,assign:true,summary:true,products:true,promptpay:true,vat:true,history:true,import:true};await load();$("login").classList.add("hide")}catch{sessionStorage.removeItem("pos_token")}}})();
</script></body></html>
